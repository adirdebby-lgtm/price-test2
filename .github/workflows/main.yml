name: מחירים יומי
on:
  workflow_dispatch:
  schedule:
    - cron: "40 3 * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install il-supermarket-scraper==1.0.8
      - run: playwright install --with-deps chromium
        continue-on-error: true
      - run: python build_index.py
      - name: Save prices.tsv
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.tsv
          git diff --cached --quiet || (git commit -m "daily prices" && git push)
