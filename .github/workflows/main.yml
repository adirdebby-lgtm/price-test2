name: מחירים יומי
on:
  workflow_dispatch:
  schedule:
    - cron: "10 6 * * *"      # 08:10 Israel time in winter (09:10 in summer: use "10 5 * * *" then)
    - cron: "20 8 * * *"      # backup if the first run found no files yet
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install il-supermarket-scraper==1.0.8
      - run: playwright install --with-deps chromium
        continue-on-error: true
      - run: python build_index.py
      - name: Save prices.tsv
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.tsv
          if ! git diff --cached --quiet; then
            git commit -m "daily prices"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              sleep 5
            done
            exit 1
          fi
